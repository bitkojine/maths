name: Markdown math

on: [push, pull_request]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install MathJax
        run: npm install --prefix "$RUNNER_TEMP/math-tools" --no-audit --no-fund mathjax-full@3.2.2
      - name: Check Markdown formulas
        run: NODE_PATH="$RUNNER_TEMP/math-tools/node_modules" node scripts/check-math.cjs
